name: Publish to GHCR (latest)

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install hadolint and yamllint
        run: |
          sudo wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          sudo apt-get update && sudo apt-get install -y yamllint
      - name: Run hadolint on Dockerfile
        run: hadolint Dockerfile
      - name: Run yamllint on docker-compose.yml
        run: yamllint docker-compose.yml

  prepare-tag:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name || steps.bump.outputs.new_tag }}
      version: ${{ steps.resolve.outputs.version || steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve existing tag
        id: resolve
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump patch tag
        id: bump
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --tags --force origin
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            latest="${latest:-v0.0.0}"
            version="${latest#v}"
            IFS=. read -r major minor patch <<< "${version}"
            new_tag="v${major}.${minor}.$((patch + 1))"
            echo "Attempt ${attempt}: tagging ${new_tag} (previous: ${latest})"
            if git tag -a "${new_tag}" -m "Release ${new_tag}" && git push origin "refs/tags/${new_tag}"; then
              echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
              echo "version=${new_tag#v}" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push failed (tag may already exist); retrying after refetch"
            git tag -d "${new_tag}" 2>/dev/null || true
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Failed to push a unique tag after 3 attempts"
              exit 1
            fi
          done

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, prepare-tag]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name (lowercase)
        id: prep
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          {
            echo "owner_lower=${OWNER_LOWER}"
            echo "repo_lower=${REPO_LOWER}"
            echo "image=${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ needs.prepare-tag.outputs.version }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Show pushed image
        run: echo "Pushed ${{ steps.prep.outputs.image }}:latest"

      - name: Export compose template with image placeholders filled
        run: |
          sed -e "s#\${OWNER_LOWER}#${{ steps.prep.outputs.owner_lower }}#g"               -e "s#\${REPO_LOWER}#${{ steps.prep.outputs.repo_lower }}#g"               docker-compose.yml > docker-compose.rendered.yml
          echo "Rendered docker-compose.rendered.yml"
          cat docker-compose.rendered.yml
